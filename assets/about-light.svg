<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" role="img" aria-label="Abdelrahman Khalifa — about">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f1f6ff"/></linearGradient>
  <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#06b6d4"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
  <radialGradient id="glow" cx="0.92" cy="0.05" r="0.6"><stop offset="0" stop-color="#06b6d4" stop-opacity="0.10"/><stop offset="1" stop-color="#06b6d4" stop-opacity="0"/></radialGradient>
</defs>
<style>
  text { font-family: Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
  .lbl { font-size: 11px; font-weight: 700; letter-spacing: 1.6px; fill: #0284c7; }
  .val { font-size: 16px; font-weight: 600; fill: #0f172a; }
  .sub { font-size: 15px; font-weight: 400; fill: #5b6b84; }
  .num { font-size: 30px; font-weight: 800; }
  .cap { font-size: 12.5px; font-weight: 500; fill: #5b6b84; }
  .row, .tile { animation: in .6s ease-out backwards; }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .pulse { animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .row, .tile { animation: none; opacity: 1; } .pulse { animation: none; } }
</style>
<rect x="1" y="1" width="858" height="398" rx="18" fill="url(#bg)" stroke="#dbe5f4"/>
<rect x="1" y="1" width="858" height="398" rx="18" fill="url(#glow)"/>
<rect x="32" y="1" width="140" height="3" rx="1.5" fill="url(#ac)"/>

<g class="row" style="animation-delay:0s">
  <circle cx="44" cy="44" r="5" fill="#22c55e" class="pulse"/>
  <text x="58" y="49" class="lbl" style="fill:#5b6b84">OPEN TO NEW OPPORTUNITIES</text>
</g>
<g class="row" style="animation-delay:0.12s">
  <text x="40" y="92" class="lbl">NOW</text>
  <text x="160" y="92"><tspan class="val">Frontend Developer @ FTL Group</tspan><tspan class="sub" dx="8">shipping FreightIn, live B2B logistics</tspan></text>
</g>
<line x1="40" y1="109" x2="820" y2="109" stroke="#dbe5f4" stroke-dasharray="2 5"/>
<g class="row" style="animation-delay:0.24s">
  <text x="40" y="130" class="lbl">BUILDING</text>
  <text x="160" y="130"><tspan class="val">Masroof</tspan><tspan class="sub" dx="8">an offline, Arabic-first expense tracker for Android</tspan></text>
</g>
<line x1="40" y1="147" x2="820" y2="147" stroke="#dbe5f4" stroke-dasharray="2 5"/>
<g class="row" style="animation-delay:0.36s">
  <text x="40" y="168" class="lbl">FOCUS</text>
  <text x="160" y="168"><tspan class="val">Figma → pixel-perfect</tspan><tspan class="sub" dx="8">· Core Web Vitals · RTL &amp; i18n · clean architecture</tspan></text>
</g>
<line x1="40" y1="185" x2="820" y2="185" stroke="#dbe5f4" stroke-dasharray="2 5"/>
<g class="row" style="animation-delay:0.48s">
  <text x="40" y="206" class="lbl">PAIRS WITH</text>
  <text x="160" y="206"><tspan class="val">Claude &amp; Codex</tspan><tspan class="sub" dx="8">to build faster and review before it ships</tspan></text>
</g>
<line x1="40" y1="223" x2="820" y2="223" stroke="#dbe5f4" stroke-dasharray="2 5"/>
<g class="row" style="animation-delay:0.60s">
  <text x="40" y="244" class="lbl">BASED IN</text>
  <text x="160" y="244"><tspan class="val">Cairo, Egypt</tspan><tspan class="sub" dx="8">· open to remote, hybrid &amp; on-site roles</tspan></text>
</g>
<g class="tile" style="animation-delay:0.80s">
  <rect x="40.0" y="290" width="184.5" height="84" rx="12" fill="#ffffff" stroke="#dbe5f4"/>
  <text x="58.0" y="332" class="num" fill="url(#ac)">2+</text>
  <text x="58.0" y="356" class="cap">years in production</text>
</g>
<g class="tile" style="animation-delay:0.90s">
  <rect x="238.5" y="290" width="184.5" height="84" rx="12" fill="#ffffff" stroke="#dbe5f4"/>
  <text x="256.5" y="332" class="num" fill="url(#ac)">3</text>
  <text x="256.5" y="356" class="cap">live platforms shipped</text>
</g>
<g class="tile" style="animation-delay:1.00s">
  <rect x="437.0" y="290" width="184.5" height="84" rx="12" fill="#ffffff" stroke="#dbe5f4"/>
  <text x="455.0" y="332" class="num" fill="url(#ac)">50+</text>
  <text x="455.0" y="356" class="cap">students taught</text>
</g>
<g class="tile" style="animation-delay:1.10s">
  <rect x="635.5" y="290" width="184.5" height="84" rx="12" fill="#ffffff" stroke="#dbe5f4"/>
  <text x="653.5" y="332" class="num" fill="url(#ac)">AR·EN</text>
  <text x="653.5" y="356" class="cap">Arabic-first &amp; RTL</text>
</g>
</svg>

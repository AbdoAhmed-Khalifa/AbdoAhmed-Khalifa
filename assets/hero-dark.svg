<text x="0.0" y="170.0" class="f-displaySemi" font-size="30" fill="url(#ac)" letter-spacing="-0.4">Frontend Developer</text>
<text x="0.0" y="222.0" class="f-body" font-size="19.5" fill="#9198a1">I build the interfaces people trust with real cargo</text>
<text x="0.0" y="252.0" class="f-body" font-size="19.5" fill="#9198a1">and real money — from Figma to production.</text>

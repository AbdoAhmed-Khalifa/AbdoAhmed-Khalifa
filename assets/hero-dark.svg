<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" role="img" aria-label="Abdelrahman Khalifa — Frontend Developer. I build the interfaces people trust with real cargo and real money — from Figma to production.">
<title>Abdelrahman Khalifa — Frontend Developer. I build the interfaces people trust with real cargo and real money — from Figma to production.</title>
<defs><linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#60a5fa"/></linearGradient><pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#30363d"/></pattern><radialGradient id="fade" cx="0.6" cy="0.5" r="0.55"><stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient><mask id="m"><rect x="560" y="0" width="320" height="360" fill="url(#fade)"/></mask></defs>
<style>
@font-face{font-family:'body';src:url(data:font/woff2;base64,) format('woff2');}
@font-face{font-family:'display';src:url(data:font/woff2;base64,) format('woff2');}
@font-face{font-family:'displaySemi';src:url(data:font/woff2;base64,) format('woff2');}
@font-face{font-family:'mono';src:url(data:font/woff2;base64,) format('woff2');}
.f-body{font-family:'body',-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;}
.f-display{font-family:'display',-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;}
.f-displaySemi{font-family:'displaySemi',-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;}
.f-mono{font-family:'mono',ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;}
.flow{stroke-dasharray:3 7;animation:flow 1.4s linear infinite}@keyframes flow{to{stroke-dashoffset:-20}}.pulse{animation:pulse 2.2s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}@media (prefers-reduced-motion: reduce){*{animation:none!important;}}
</style>
<rect x="560" y="0" width="320" height="360" fill="url(#dots)" mask="url(#m)"/>
<path d="M612 300 C 680 300, 676 196, 744 196 S 806 92, 860 92" fill="none" stroke="#30363d" stroke-width="2"/>
<path d="M612 300 C 680 300, 676 196, 744 196 S 806 92, 860 92" fill="none" stroke="url(#ac)" stroke-width="2" class="flow"/>

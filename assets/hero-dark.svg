<text x="339.3" y="352.0" class="f-displaySemi" font-size="30" fill="#f0f6fc" letter-spacing="-0.4">Web + Mobile</text>
<text x="339.3" y="380.0" class="f-mono" font-size="10.5" fill="#7d8590" letter-spacing="1.4">REACT · REACT NATIVE</text>

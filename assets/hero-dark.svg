<circle cx="19" cy="35" r="4.5" fill="#3fb950" class="pulse"/>
<text x="32.0" y="39.2" class="f-mono" font-size="11.5" fill="#9198a1" letter-spacing="1.6">OPEN TO NEW OPPORTUNITIES</text>
<text x="274.9" y="39.2" class="f-mono" font-size="11.5" fill="#7d8590" letter-spacing="1.6">/  CAIRO, EGYPT</text>

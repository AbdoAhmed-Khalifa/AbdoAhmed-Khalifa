<circle cx="860" cy="92" r="5" fill="url(#ac)"/>
<text x="860.0" y="66.0" class="f-mono" font-size="12" fill="#7d8590" text-anchor="end">production</text>
<circle r="3.5" fill="#22d3ee"><animateMotion dur="4s" repeatCount="indefinite" path="M612 300 C 680 300, 676 196, 744 196 S 806 92, 860 92"/></circle>
